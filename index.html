<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>NEXUS IA — DNA DE LUXO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: white; font-family: 'Orbitron', sans-serif; overflow-x: hidden; }
        .neon-border { border: 1px solid #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
        .neon-text-orange { color: #f97316; text-shadow: 0 0 10px rgba(249, 115, 22, 0.8); }
        .glass { background: rgba(20, 20, 25, 0.8); backdrop-filter: blur(10px); }
        .grid-numbers { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
        .ball { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s; }
        .btn-nexus { background: linear-gradient(90deg, #f97316, #ef4444); box-shadow: 0 0 20px rgba(249, 115, 22, 0.5); transition: transform 0.2s, opacity 0.2s; }
        .btn-nexus:hover { transform: scale(1.02); opacity: 0.9; }
        .btn-nexus:active { transform: scale(0.98); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold tracking-widest neon-text-orange">NEXUS IA <span class="text-white text-[10px] block">SISTEMA DNA 100+</span></h1>
            <div class="flex gap-4">
                <button onclick="testarConexao()" class="px-4 py-2 bg-blue-600/10 border border-blue-500/50 rounded text-[9px] text-blue-400 hover:bg-blue-600/20 transition">VERIFICAR API</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-4 space-y-6">
                <div class="glass p-6 rounded-2xl neon-border text-center">
                    <h3 class="text-[9px] text-gray-400 uppercase mb-4 tracking-widest font-bold">Assertividade em Tempo Real</h3>
                    <div class="flex justify-around items-center">
                        <div>
                            <p class="text-green-500 text-3xl font-black" id="count-green">0</p>
                            <p class="text-[8px] text-gray-500">GREENS</p>
                        </div>
                        <div class="h-8 w-[1px] bg-gray-800"></div>
                        <div>
                            <p class="text-red-500 text-3xl font-black" id="count-loss">0</p>
                            <p class="text-[8px] text-gray-500">LOSSES</p>
                        </div>
                        <div class="h-8 w-[1px] bg-gray-800"></div>
                        <div>
                            <p class="neon-text-orange text-3xl font-black" id="porcentagem">0%</p>
                            <p class="text-[8px] text-gray-500">WIN RATE</p>
                        </div>
                    </div>
                </div>

                <div class="glass p-6 rounded-2xl border border-gray-800">
                    <p id="status-dna" class="text-blue-400 text-[9px] mb-2 italic">Aguardando novo giro...</p>
                    <div class="flex items-center gap-6">
                        <div id="numero-alvo" class="text-6xl font-black italic">--</div>
                        <div class="space-y-1">
                            <p class="text-[10px] text-gray-500 uppercase">Resultado do Ciclo:</p>
                            <p id="resultado-texto" class="text-sm font-bold uppercase text-white">Monitorando...</p>
                        </div>
                    </div>
                </div>

                <button onclick="atualizarInterface()" class="btn-nexus w-full py-5 rounded-xl text-lg font-black tracking-widest flex items-center justify-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                    GERAR ANÁLISE IA
                </button>
            </div>

            <div class="lg:col-span-8">
                <div class="glass p-6 rounded-2xl border border-gray-800 h-full">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-[10px] font-bold text-gray-400 uppercase italic tracking-widest">Histórico DNA (Últimos 100 Giros)</h3>
                        <span class="text-[9px] text-gray-600 uppercase font-mono">Terminal Repete 3-6x</span>
                    </div>
                    <div id="grid-100" class="grid-numbers">
                        </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://tpotbyekboefgcbgmckp.supabase.co';
        const supabaseKey = 'SUA_CHAVE_ANON_AQUI'; // <--- COLOQUE SUA CHAVE AQUI! [cite: 2025-12-29]
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function testarConexao() {
            alert("Verificando conexão com o motor Render/Supabase...");
            const { data, error } = await _supabase.from('resultados_nexus').select('id').limit(1);
            if(error) alert("❌ Erro na API: " + error.message);
            else alert("✅ Sistema Sincronizado!");
        }

        async function atualizarInterface() {
            const { data, error } = await _supabase
                .from('resultados_nexus')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(100);

            if (data && data.length > 0) {
                // Atualiza Placar [cite: 2025-12-29]
                const greens = data.filter(d => d.resultado && d.resultado.includes('✅')).length;
                const losses = data.filter(d => d.resultado && d.resultado.includes('❌')).length;
                const totalValidos = greens + losses;
                
                document.getElementById('count-green').innerText = greens;
                document.getElementById('count-loss').innerText = losses;
                document.getElementById('porcentagem').innerText = totalValidos > 0 ? ((greens / totalValidos) * 100).toFixed(0) + "%" : "0%";

                // Atualiza Análise Principal [cite: 2025-12-29]
                const ultimo = data[0];
                document.getElementById('numero-alvo').innerText = ultimo.numero;
                document.getElementById('resultado-texto').innerText = ultimo.resultado || "PROCESSANDO";
                
                // Monitor de Pagamento Parcelado [cite: 2025-12-29]
                const statusDna = document.getElementById('status-dna');
                if(ultimo.resultado && ultimo.resultado.toLowerCase().includes("picado")) {
                    statusDna.innerText = "⚠️ ROLETA INICIOU PAGAMENTO PICADO";
                    statusDna.classList.add('text-blue-400', 'animate-pulse');
                } else {
                    statusDna.innerText = "✅ DNA: MONITORANDO TERMINAIS (3-6x)";
                    statusDna.classList.remove('animate-pulse');
                }

                // Renderiza as 100 bolinhas [cite: 2025-12-29]
                const grid = document.getElementById('grid-100');
                grid.innerHTML = data.map(d => {
                    const isGreen = d.resultado && d.resultado.includes('✅');
                    const isLoss = d.resultado && d.resultado.includes('❌');
                    let cor = 'bg-white/5 text-gray-500 border-gray-800';
                    if (isGreen) cor = 'bg-green-500/20 border-green-500/50 text-green-500';
                    if (isLoss) cor = 'bg-red-500/20 border-red-500/50 text-red-500';
                    return `<div class="ball ${cor}">${d.numero}</div>`;
                }).join('');
            }
        }

        setInterval(atualizarInterface, 5000); // Auto-update a cada 5s [cite: 2025-12-29]
        window.onload = atualizarInterface;
    </script>
</body>
</html>
