<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NEXUS IA - Sistema de Inteligência Preditiva</title>
    <style>
        :root {
            --bg-dark: #050505;
            --card-bg: #0f0f0f;
            --nexus-blue: #00d4ff;
            --nexus-orange: #ff4e00;
            --nexus-green: #00ff41;
            --nexus-red: #e61e1e;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Roboto Mono', monospace;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 20px;
        }

        .header-nexus {
            text-align: center;
            border-bottom: 2px solid #1a1a1a;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .logo-nexus {
            font-size: 2.2rem;
            letter-spacing: 6px;
            background: linear-gradient(to right, var(--nexus-blue), var(--nexus-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        /* Grade de Histórico - Números Menores e Organizados */
        .history-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr); /* 10 por linha */
            gap: 4px;
            margin-top: 15px;
        }

        .num-cell {
            height: 35px; /* Tamanho reduzido conforme pedido */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .red { background-color: var(--nexus-red); }
        .black { background-color: #1a1a1a; color: #ccc; }
        .green { background-color: var(--nexus-green); color: black; }

        /* Estilo do Alerta de Gatilho */
        .alert-box {
            background: rgba(0, 212, 255, 0.05);
            border-left: 4px solid var(--nexus-blue);
            padding: 15px;
            margin: 20px 0;
            display: none; /* Só aparece no gatilho */
        }

        .scan-button {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--nexus-blue);
            color: var(--nexus-blue);
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .scan-button:hover {
            background: var(--nexus-blue);
            color: black;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header-nexus">
        <h1 class="logo-nexus">NEXUS</h1>
        <small style="color: #666;">SURPASS YOURSELF | MÓDULO DNA INTEGRADO</small>
    </div>

    <button class="scan-button" onclick="executarAnalise()">SOLICITAR ANÁLISE IA</button>

    <div id="nexus-alert" class="alert-box">
        <strong id="strategy-name" style="color: var(--nexus-blue);"></strong><br>
        <span id="target-details"></span>
    </div>

    <div style="margin-top: 30px;">
        <span style="font-size: 0.7rem; color: #555;">HISTÓRICO CRONOLÓGICO (ESQ -> DIR)</span>
        <div class="history-grid" id="historyContainer"></div>
    </div>
</div>

<script>
    // Definição exata das cores da roleta
    const reds = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    
    // Simulação de histórico real (substitua pela sua API/Supabase)
    let historicoReal = [];
    for(let i=0; i<100; i++) {
        historicoReal.push(Math.floor(Math.random() * 37));
    }

    function renderizarGrade() {
        const container = document.getElementById('historyContainer');
        container.innerHTML = '';
        
        historicoReal.forEach((num, index) => {
            const cell = document.createElement('div');
            cell.className = 'num-cell';
            cell.innerText = num;
            
            if (num === 0) cell.classList.add('green');
            else if (reds.includes(num)) cell.classList.add('red');
            else cell.classList.add('black');
            
            // O primeiro número (índice 0) é o mais recente
            if(index === 0) cell.style.boxShadow = "inset 0 0 10px white";

            container.appendChild(cell);
        });
    }

    function executarAnalise() {
        // Implementação do DNA: Soma Larissa
        // Gatilho: V_D3 -> P_D2 -> P_D2
        const n1 = historicoReal[0]; // mais recente
        const n2 = historicoReal[1];
        const n3 = historicoReal[2];

        const alertBox = document.getElementById('nexus-alert');
        const strategyName = document.getElementById('strategy-name');
        const targetDetails = document.getElementById('target-details');

        // Exemplo de ativação do DNA de Soma
        let soma = n1 + n2 + n3;
        if (soma > 36) soma = Math.floor(soma/10) + (soma%10);

        alertBox.style.display = "block";
        strategyName.innerText = "GATILHO DE SOMA DETECTADO";
        targetDetails.innerText = `Alvo: ${soma} | Proteção: 0, 21 e Vizinhos de Race.`;
    }

    renderizarGrade();
</script>

</body>
</html>
