<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS IA — DNA PROFISSIONAL</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; }
        .container { display: flex; width: 100%; height: 100vh; }
        .painel { flex: 2; padding: 40px; }
        .lateral { flex: 1; border-left: 1px solid #00f2ff; padding: 20px; background: #050505; }
        .status-box { border: 2px solid #00f2ff; border-radius: 15px; padding: 20px; margin-top: 20px; text-align: center; }
        #monitor-status { font-size: 24px; font-weight: bold; color: #00f2ff; }
        .btn { background: linear-gradient(to right, #ff6600, #ffcc00); border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 20px; }
        .bola { width: 40px; height: 40px; border-radius: 50%; display: inline-block; margin: 5px; text-align: center; line-height: 40px; font-weight: bold; }
        .Vermelho { background: #ff0000; } .Preto { background: #1a1a1a; border: 1px solid #444; } .Verde { background: #00ff00; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <div class="painel">
            <h1 style="color:#ff6600">NEXUS <span style="color:#fff">IA</span></h1>
            <p style="color:#888">SISTEMA DNA PROFISSIONAL</p>
            <div style="display:flex; gap:30px">
                <div><h2>0</h2><p>GREENS</p></div>
                <div><h2>0</h2><p>LOSSES</p></div>
                <div><h2>100%</h2><p>WIN</p></div>
            </div>
            <div class="status-box">
                <p style="text-align:left; color:#00f2ff; font-size:12px">■ MONITOR DE CICLOS DNA</p>
                <div id="monitor-status">AGUARDANDO SINAL...</div>
            </div>
            <button class="btn">GERAR ANÁLISE IA</button>
        </div>
        <div class="lateral">
            <p style="color:#888; font-size:12px">HISTÓRICO REAL (ÚLTIMOS 100 GIROS)</p>
            <div id="historico"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const URL = "https://tpotbyekboefgbgmckp.supabase.co";
        const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwb3RieWVrYm9lZmdjYmdtY2twIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NjgwNzU2OCwiZXhwIjoyMDgyMzgzNTY4fQ.F7J0g_iTIE_7oxXsGpObSsRq7AApc1y7pvpLmYjQcgk";
        const supabaseClient = supabase.createClient(URL, KEY);

        async function carregarHistorico() {
            const { data } = await supabaseClient.from('resultados_nexus').select('*').order('id', { ascending: false }).limit(20);
            if (data) data.forEach(item => adicionarBola(item.numero, item.cor));
        }

        function adicionarBola(num, cor) {
            const div = document.createElement('div');
            div.className = `bola ${cor}`;
            div.innerText = num;
            document.getElementById('historico').prepend(div);
        }

        // Escuta o Python enviando dados novos
        supabaseClient.channel('custom-all-channel')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'resultados_nexus' }, (payload) => {
            const novo = payload.new;
            document.getElementById('monitor-status').innerText = novo.resultado;
            adicionarBola(novo.numero, novo.cor);
        }).subscribe();

        carregarHistorico();
    </script>
</body>
</html>
