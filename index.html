<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS IA - Protocolo Multicamadas</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="container-principal">
        <header>
            <h1>NEXUS <span style="color: #ffd700;">IA</span></h1>
            <p id="status-bot">SISTEMA ATIVO: DNA DE LUXO</p>
        </header>

        <div id="display-motor">
            <div id="motor-num">--</div>
        </div>

        <div id="container-sinal" onclick="gerarAnaliseIA()" style="cursor: pointer;">
            <p style="font-size: 0.8rem; color: #888; margin-bottom: 5px;">SINAL DE ENTRADA</p>
            <div id="texto-sinal">AGUARDANDO DADOS...</div>
        </div>

        <div id="container-historico">
            <p style="text-align: center; margin-bottom: 15px; color: #aaa;">ÚLTIMOS 24 RESULTADOS</p>
            <div id="historico-lista">
                </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://tpotbyekboefgbgmckp.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwb3RieWVrYm9lZmdjYmdtY2twIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MDc1NjgsImV4cCI6MjA4MjM4MzU2OH0.rlZzMH0EWY54gk9MNolp_KTC2DYFxkb3P7KtPw_aYWw";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        let ultimoId = null;

        async function sincronizarNexus() {
            const { data } = await supabaseClient.from('resultados_nexus').select('*').order('id', { ascending: false }).limit(1);
            
            if (data && data[0] && data[0].id !== ultimoId) {
                ultimoId = data[0].id;
                const reg = data[0];
                
                const motor = document.getElementById('motor-num');
                motor.innerText = reg.numero;
                
                // Aplica as cores do DNA (0 Verde, resto exato) [cite: 2025-12-28, 2025-12-29]
                motor.style.color = (reg.cor === "Vermelho") ? "#ff4d4d" : (reg.cor === "Verde") ? "#00ff7f" : "#fff";
                
                document.getElementById('texto-sinal').innerText = reg.resultado.toUpperCase();
                carregarHistoricoDNA();
            }
        }

        async function gerarAnaliseIA() {
            const { data } = await supabaseClient.from('resultados_nexus').select('*').order('id', { ascending: false }).limit(1);
            if (data && data[0]) {
                const reg = data[0];
                const sinal = document.getElementById('texto-sinal');
                
                // Lógica de Alvo/Parcelamento do DNA [cite: 2025-12-29]
                if (reg.resultado.includes("picado")) {
                    const alvo = 6; 
                    const falta = alvo - reg.numero;
                    sinal.innerText = `ALVO: ${falta} OU ${alvo}`;
                    sinal.style.color = "#ffd700";
                } else {
                    sinal.innerText = "BUSCANDO ENTRADA...";
                }
            }
        }

        async function carregarHistoricoDNA() {
            const { data } = await supabaseClient.from('resultados_nexus').select('numero, cor').order('id', { ascending: false }).limit(24);
            const lista = document.getElementById('historico-lista');
            if (lista && data) {
                lista.innerHTML = data.map(n => `
                    <div style="background:#1a1a1a; padding:10px; border-radius:8px; border-bottom: 3px solid ${n.cor=='Vermelho'?'#ff4d4d':n.cor=='Verde'?'#00ff7f':'#444'}; font-weight:bold; color: white;">
                        ${n.numero}
                    </div>
                `).join('');
            }
        }

        setInterval(sincronizarNexus, 5000);
        sincronizarNexus();
    </script>
</body>
</html>
