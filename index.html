<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS IA — MEGA ROULETTE DNA</title>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .container { display: flex; width: 100%; }
        .painel { flex: 2; padding: 40px; display: flex; flex-direction: column; gap: 20px; }
        .lateral { flex: 1; border-left: 2px solid #00f2ff; padding: 20px; background: rgba(0,242,255,0.05); overflow-y: auto; }
        .logo { color: #ff6600; font-size: 32px; font-weight: bold; text-shadow: 0 0 10px #ff6600; }
        .status-box { border: 2px solid #00f2ff; border-radius: 15px; padding: 30px; text-align: center; background: rgba(0,242,255,0.1); box-shadow: inset 0 0 20px rgba(0,242,255,0.2); }
        #monitor-status { font-size: 26px; font-weight: bold; color: #00f2ff; text-transform: uppercase; }
        .bola { width: 45px; height: 45px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin: 5px; font-weight: bold; border: 2px solid rgba(255,255,255,0.2); }
        .Vermelho { background: radial-gradient(circle, #ff4b2b, #ff0000); } 
        .Preto { background: radial-gradient(circle, #434343, #000000); } 
        .Verde { background: radial-gradient(circle, #00ff00, #008000); color: #000; }
        .btn { background: linear-gradient(90deg, #ff6600, #ffcc00); border: none; padding: 20px; border-radius: 10px; color: #000; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.02); box-shadow: 0 0 15px #ff6600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="painel">
            <div class="logo">NEXUS IA</div>
            <p style="color: #888; margin-top: -15px;">SISTEMA DNA PROFISSIONAL — MEGA ROULETTE</p>
            <div class="status-box">
                <p style="text-align: left; color: #00f2ff; font-size: 12px; margin: 0 0 10px 0;">■ MONITOR DE CICLOS DNA</p>
                <div id="monitor-status">SINCRONIZANDO BANCO...</div>
            </div>
            <button class="btn">GERAR ANÁLISE IA</button>
        </div>
        <div class="lateral">
            <p style="color: #888; font-size: 12px; margin-bottom: 20px;">HISTÓRICO REAL (ÚLTIMOS GIROS)</p>
            <div id="lista-bolinhas"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // CORREÇÃO DA URL MALFORMADA
        const SUPABASE_URL = "https://tpotbyekboefgbgmckp.supabase.co".trim();
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwb3RieWVrYm9lZmdjYmdtY2twIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NjgwNzU2OCwiZXhwIjoyMDgyMzgzNTY4fQ.F7J0g_iTIE_7oxXsGpObSsRq7AApc1y7pvpLmYjQcgk".trim();
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function adicionarBola(num, cor) {
            const lista = document.getElementById('lista-bolinhas');
            const item = document.createElement('div');
            item.className = `bola ${cor}`;
            item.innerText = num;
            lista.prepend(item);
        }

        // CARREGA OS 101 REGISTROS QUE VIMOS NO PRINT
        async function init() {
            const { data, error } = await supabaseClient.from('resultados_nexus').select('*').order('id', { ascending: false }).limit(20);
            if (data) {
                document.getElementById('monitor-status').innerText = "SINAL CONECTADO";
                data.reverse().forEach(i => adicionarBola(i.numero, i.cor));
            }
        }

        // ESCUTA NOVOS SINAIS EM TEMPO REAL
        supabaseClient.channel('public:resultados_nexus')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'resultados_nexus' }, (payload) => {
            const novo = payload.new;
            const monitor = document.getElementById('monitor-status');
            monitor.innerText = novo.resultado;
            monitor.style.color = novo.resultado.includes("pagamer") ? "#FF8C00" : "#00f2ff";
            adicionarBola(novo.numero, novo.cor);
        }).subscribe();

        init();
    </script>
</body>
</html>
