<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS IA — DNA PROFISSIONAL</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .container { display: flex; width: 100%; }
        .painel { flex: 2; padding: 40px; display: flex; flex-direction: column; gap: 20px; }
        .lateral { flex: 1; border-left: 2px solid #00f2ff; padding: 20px; background: rgba(255,255,255,0.05); overflow-y: auto; }
        .logo { color: #ff6600; font-size: 32px; font-weight: bold; }
        .status-box { border: 2px solid #00f2ff; border-radius: 15px; padding: 30px; text-align: center; background: rgba(0,242,255,0.05); }
        #monitor-status { font-size: 28px; font-weight: bold; color: #00f2ff; text-transform: uppercase; }
        .btn { background: linear-gradient(90deg, #ff6600, #ffcc00); border: none; padding: 20px; border-radius: 10px; color: #000; font-weight: bold; font-size: 18px; cursor: pointer; width: 100%; }
        .bola { width: 45px; height: 45px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin: 5px; font-weight: bold; }
        .Vermelho { background: #ff0000; } .Preto { background: #1a1a1a; border: 1px solid #444; } .Verde { background: #00ff00; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <div class="painel">
            <div class="logo">NEXUS IA</div>
            <p style="color: #888; margin-top: -15px;">SISTEMA DNA PROFISSIONAL</p>
            <div style="display: flex; gap: 30px;">
                <div><h2 id="greens">0</h2><p>GREENS</p></div>
                <div><h2 id="losses">0</h2><p>LOSSES</p></div>
                <div><h2 id="winrate">100%</h2><p>WIN</p></div>
            </div>
            <div class="status-box">
                <p style="text-align: left; color: #00f2ff; font-size: 12px; margin: 0 0 10px 0;">■ MONITOR DE CICLOS DNA</p>
                <div id="monitor-status">AGUARDANDO SINAL...</div>
            </div>
            <button class="btn">GERAR ANÁLISE IA</button>
        </div>
        <div class="lateral" id="historico">
            <p style="color: #888; font-size: 12px;">HISTÓRICO REAL (ÚLTIMOS 100 GIROS)</p>
            <div id="lista-bolinhas"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // URL E KEY CORRIGIDAS
        const SUPABASE_URL = "https://tpotbyekboefgbgmckp.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwb3RieWVrYm9lZmdjYmdtY2twIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NjgwNzU2OCwiZXhwIjoyMDgyMzgzNTY4fQ.F7J0g_iTIE_7oxXsGpObSsRq7AApc1y7pvpLmYjQcgk";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function adicionarBola(num, cor) {
            const lista = document.getElementById('lista-bolinhas');
            const item = document.createElement('div');
            item.className = `bola ${cor}`;
            item.innerText = num;
            lista.prepend(item);
            if (lista.children.length > 100) lista.lastChild.remove();
        }

        // CONEXÃO DNA EM TEMPO REAL [cite: 2025-12-29]
        supabaseClient.channel('public:resultados_nexus')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'resultados_nexus' }, (payload) => {
            const novo = payload.new;
            const monitor = document.getElementById('monitor-status');
            
            monitor.innerText = novo.resultado;
            // Cor dinâmica para o DNA de Parcelamento [cite: 2025-12-29]
            monitor.style.color = novo.resultado.includes("picado") ? "#FF8C00" : "#00f2ff";
            
            adicionarBola(novo.numero, novo.cor);
        }).subscribe();

        // Carregar giros anteriores
        async function init() {
            const { data } = await supabaseClient.from('resultados_nexus').select('*').order('id', { ascending: false }).limit(20);
            if (data) data.reverse().forEach(i => adicionarBola(i.numero, i.cor));
        }
        init();
    </script>
</body>
</html>
