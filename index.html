<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Mantendo o seu layout original que você gosta */
        body { background-color: #000; color: #fff; font-family: sans-serif; }
        .painel-principal { background-color: #111; border-radius: 20px; padding: 40px; text-align: center; border: 1px solid #333; }
        #numero-atual { font-size: 100px; font-weight: bold; line-height: 1; }
        .btn-gerar { background-color: #ff4500; color: white; padding: 15px 30px; border-radius: 10px; font-weight: bold; margin-top: 20px; width: 100%; cursor: pointer; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-sm">
        <h1 class="text-center text-orange-500 font-bold mb-4">SISTEMA NEXUS IA</h1>
        
        <div class="painel-principal">
            <p class="text-xs text-gray-500 uppercase mb-2">Último Resultado</p>
            <div id="numero-atual">--</div>
            <p id="status-ciclo" class="text-sm mt-2 text-gray-400">Aguardando sinal...</p>
            
            <button class="btn-gerar" onclick="gerarAnaliseIA()">GERAR ANÁLISE</button>
        </div>

        <div class="mt-6">
            <p class="text-xs text-gray-500 mb-2">HISTÓRICO RECENTE</p>
            <div id="lista-historico" class="flex flex-wrap gap-2 justify-center">
                </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://tpotbyekboefgbgmckp.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwb3RieWVrYm9lZmdjYmdtY2twIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MDc1NjgsImV4cCI6MjA4MjM4MzU2OH0.rlZzMH0EWY54gk9MNolp_KTC2DYFxkb3P7KtPw_aYWw";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        let ultimoId = null;

        // Função que faz os números aparecerem na tela [cite: 2025-12-29]
        async function buscarDados() {
            const { data } = await supabaseClient
                .from('resultados_nexus')
                .select('*')
                .order('id', { ascending: false })
                .limit(1);

            if (data && data.length > 0 && data[0].id !== ultimoId) {
                ultimoId = data[0].id;
                const reg = data[0];
                
                const numElement = document.getElementById('numero-atual');
                numElement.innerText = reg.numero;
                
                // Aplica Cores do DNA (0 Verde, resto conforme lista) [cite: 2025-12-28, 2025-12-29]
                numElement.style.color = (reg.cor === "Vermelho") ? "#ff0000" : 
                                         (reg.cor === "Verde") ? "#00ff00" : "#fff";
                
                document.getElementById('status-ciclo').innerText = reg.resultado;
                carregarHistorico();
            }
        }

        // A Lógica de Alvos que você pediu [cite: 2025-12-29]
        async function gerarAnaliseIA() {
            const { data } = await supabaseClient
                .from('resultados_nexus')
                .select('*')
                .order('id', { ascending: false })
                .limit(1);

            if (data && data.length > 0) {
                const reg = data[0];
                const status = document.getElementById('status-ciclo');

                if (reg.resultado.includes("picado")) {
                    const alvo = 6; // Seu alvo de exemplo
                    const falta = alvo - reg.numero;
                    alert(`🎯 ALVO ENCONTRADO!\nEntrada: Complemento (${falta}) ou Alvo Direto (${alvo})\nJustificativa: Roleta iniciou pagamento picado.`);
                    status.innerText = `ENTRADA: ${falta} ou ${alvo}`;
                } else {
                    alert("Aguardando confirmação de ciclo pelo DNA...");
                }
            }
        }

        async function carregarHistorico() {
            const { data } = await supabaseClient
                .from('resultados_nexus')
                .select('numero, cor')
                .order('id', { ascending: false })
                .limit(10);

            if (data) {
                document.getElementById('lista-historico').innerHTML = data.map(n => `
                    <div style="background:#222; padding:10px; border-radius:5px; border-bottom: 2px solid ${n.cor=='Vermelho'?'red':n.cor=='Verde'?'green':'#555'}">
                        ${n.numero}
                    </div>
                `).join('');
            }
        }

        setInterval(buscarDados, 5000);
        buscarDados();
    </script>
</body>
</html>
