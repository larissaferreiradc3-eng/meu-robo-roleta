<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS IA — DNA PROFISSIONAL</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; }
        #monitor-status { font-size: 24px; font-weight: bold; margin: 20px; }
        .historico-lateral { border-left: 2px solid #00f2ff; padding: 10px; min-height: 400px; }
        .bola { width: 40px; height: 40px; border-radius: 50%; display: inline-block; margin: 5px; text-align: center; line-height: 40px; font-weight: bold; }
        .verde { background: #008000; }
        .vermelho { background: #ff0000; }
        .preto { background: #222; border: 1px solid #fff; }
    </style>
</head>
<body>

    <div id="app">
        <h1>NEXUS IA</h1>
        
        <div id="painel-dna">
            <p>MONITOR DE CICLOS DNA</p>
            <div id="monitor-status">CONECTANDO SINAL...</div>
        </div>

        <div class="historico-lateral" id="historico">
            <p>HISTÓRICO REAL (ÚLTIMOS 100 GIROS)</p>
            <div id="lista-bolinhas"></div>
        </div>
    </div>

    <script>
        // 1. NOVAS FONTES DE DADOS (PRAGMATIC)
        const API_WS = 'wss://api.revesbot.com.br/ws';
        let memoriaParcelada = 0;

        // 2. FUNÇÃO CORE: DNA DE PARCELAMENTO [cite: 2025-12-29]
        function processarDNA(numero) {
            const alvo = 6;
            const monitor = document.getElementById('monitor-status');

            // Lógica de Pagamento Parcelado (Substituição por Decomposição) [cite: 2025-12-29]
            if (numero < alvo && numero > 0) {
                memoriaParcelada += numero;
                if (memoriaParcelada === alvo) {
                    memoriaParcelada = 0;
                    monitor.innerText = "GREEN POR SOMA PARCELADA"; [cite: 2025-12-29]
                    monitor.style.color = "#00FF00";
                } else {
                    monitor.innerText = "AGUARDAR COMPLEMENTO"; [cite: 2025-12-29]
                    monitor.style.color = "#FF8C00"; // Laranja Neon
                }
            } else if (numero === alvo) {
                memoriaParcelada = 0;
                monitor.innerText = "GREEN DIRETO";
                monitor.style.color = "#00FF00";
            } else {
                memoriaParcelada = 0;
                monitor.innerText = "ANALISANDO PADRÕES...";
                monitor.style.color = "#FFFFFF";
            }
        }

        // 3. CONEXÃO WEBSOCKET PARA EVITAR ERRO DE SINAL
        function iniciarConexao() {
            const socket = new WebSocket(API_WS);

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                // No DNA, o 0 é sempre Verde [cite: 2025-12-29]
                const cor = (data.numero === 0) ? 'verde' : (data.cor === 'red' ? 'vermelho' : 'preto');
                
                processarDNA(data.numero);
                adicionarBolinha(data.numero, cor);
            };

            socket.onclose = () => setTimeout(iniciarConexao, 3000);
            socket.onerror = () => console.log("Erro de rede. Reconectando...");
        }

        // 4. HISTÓRICO VISUAL (BOLINHAS 3D)
        function adicionarBolinha(num, cor) {
            const lista = document.getElementById('lista-bolinhas');
            const novaBola = document.createElement('div');
            novaBola.className = `bola ${cor}`;
            novaBola.innerText = num;
            lista.prepend(novaBola); // Adiciona no topo
            
            if (lista.children.length > 100) lista.lastChild.remove();
        }

        iniciarConexao();
    </script>
</body>
</html>
