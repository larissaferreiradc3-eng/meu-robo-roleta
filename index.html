<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>NEXUS IA — DNA DE LUXO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: white; font-family: 'Orbitron', sans-serif; }
        .neon-border { border: 1px solid #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
        .neon-text-orange { color: #f97316; text-shadow: 0 0 10px rgba(249, 115, 22, 0.8); }
        .glass { background: rgba(20, 20, 25, 0.8); backdrop-filter: blur(10px); }
        .pulse-blue { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-widest neon-text-orange">NEXUS IA <span class="text-white text-xs block">VIP ONLINE</span></h1>
                <div class="mt-2 flex gap-3 items-center">
                    <button onclick="testarConexao()" class="px-3 py-1 bg-blue-600/20 border border-blue-500 rounded text-[9px] hover:bg-blue-600/40 transition">
                        TESTAR CONEXÃO
                    </button>
                    <span id="debug-status" class="text-[9px] text-gray-500 font-mono italic">Aguardando comando...</span>
                </div>
            </div>
            <div class="text-right">
                <span class="text-[10px] text-gray-500 uppercase">Status do Servidor Render:</span>
                <span class="text-[10px] text-green-500 block">● LIVE / CONECTADO</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="glass p-8 rounded-2xl neon-border">
                    <h2 class="text-xs text-gray-400 mb-2 uppercase tracking-tighter">Assertividade Estratégica</h2>
                    <div id="porcentagem" class="text-6xl font-black neon-text-orange">0.0%</div>
                    <p id="status-dna" class="mt-4 text-blue-400 text-sm italic">Sincronizando com o motor Nexus...</p>
                </div>

                <div class="glass p-6 rounded-2xl border border-gray-800">
                    <h3 class="text-gray-500 text-[10px] uppercase mb-4 tracking-widest">Última Predição (Motor DNA)</h3>
                    <div class="flex items-center gap-10">
                        <div id="numero-alvo" class="text-7xl font-bold italic">- -</div>
                        <div class="space-y-1">
                            <p class="text-[10px] text-gray-500 uppercase">Análise de Ciclo:</p>
                            <p id="resultado-texto" class="text-lg font-bold text-white uppercase tracking-tight">Monitorando Roleta...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass p-6 rounded-2xl border border-gray-800 h-[500px] flex flex-col">
                <h3 class="text-[10px] font-bold text-gray-500 uppercase mb-4 italic tracking-widest border-b border-gray-800 pb-2">Histórico de Ciclos</h3>
                <div id="lista-historico" class="space-y-3 overflow-y-auto flex-1 pr-2 scrollbar-hide">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configurações do Supabase [cite: 2025-12-29]
        const supabaseUrl = 'https://tpotbyekboefgcbgmckp.supabase.co';
        const supabaseKey = 'SUA_CHAVE_ANON_AQUI'; // <--- COLE SUA CHAVE AQUI LARISSA!
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function testarConexao() {
            const statusDiv = document.getElementById('debug-status');
            statusDiv.innerText = "⏳ VERIFICANDO...";
            try {
                const { data, error } = await _supabase.from('resultados_nexus').select('id').limit(1);
                if (error) throw error;
                statusDiv.innerText = "✅ CONECTADO AO BANCO!";
                statusDiv.classList.replace('text-gray-500', 'text-green-500');
                atualizarInterface();
            } catch (err) {
                statusDiv.innerText = "❌ ERRO DE CONEXÃO";
                statusDiv.classList.replace('text-gray-500', 'text-red-500');
            }
        }

        async function atualizarInterface() {
            const { data, error } = await _supabase
                .from('resultados_nexus')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(20);

            if (data && data.length > 0) {
                const ultimo = data[0];
                document.getElementById('numero-alvo').innerText = ultimo.numero;
                document.getElementById('resultado-texto').innerText = ultimo.resultado || "ANALISANDO...";
                
                // Monitor de Pagamento Parcelado (DNA) [cite: 2025-12-29]
                const statusDna = document.getElementById('status-dna');
                if(ultimo.resultado && ultimo.resultado.toLowerCase().includes("picado")) {
                    statusDna.innerText = "⚠️ ROLETA INICIOU PAGAMENTO PICADO (AGUARDANDO COMPLEMENTO)";
                    statusDna.classList.add('pulse-blue', 'text-blue-400');
                } else {
                    statusDna.innerText = "✅ MOTOR DNA EM SINCRONIA";
                    statusDna.classList.remove('pulse-blue');
                }

                // Cálculo de Assertividade Real [cite: 2025-12-29]
                const greens = data.filter(d => d.resultado && d.resultado.includes('✅')).length;
                const perc = ((greens / data.length) * 100).toFixed(1);
                document.getElementById('porcentagem').innerText = perc + "%";

                // Lista de Histórico Profissional
                const lista = document.getElementById('lista-historico');
                lista.innerHTML = data.map(d => `
                    <div class="flex justify-between items-center p-3 bg-white/5 rounded-lg border-l-2 ${d.resultado && d.resultado.includes('✅') ? 'border-green-500' : 'border-blue-500'}">
                        <span class="text-xl font-bold">${d.numero}</span>
                        <span class="text-[8px] uppercase font-mono opacity-60">${d.resultado || 'PROCESSANDO'}</span>
                    </div>
                `).join('');
            }
        }

        setInterval(atualizarInterface, 5000); // Atualiza a cada 5 segundos [cite: 2025-12-29]
        window.onload = atualizarInterface;
    </script>
</body>
</html>
