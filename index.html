<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS IA — Surpass Yourself</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="main-nav">
            <div class="logo">NEXUS <span>IA</span></div>
            <div class="user-status">VIP - ONLINE</div>
        </header>

        <div class="dashboard-grid">
            <div class="card stats-card">
                <h3>ASSERTIVIDADE</h3>
                <div class="stats-main">
                    <div id="win-rate" class="percent">0.0%</div>
                    <div class="stats-counters">
                        <div class="counter win">Greens: <span id="count-greens">0</span></div>
                        <div class="counter loss">Losses: <span id="count-losses">0</span></div>
                    </div>
                </div>
            </div>

            <div class="card health-card">
                <h3>SAÚDE DAS ESTRATÉGIAS</h3>
                <div id="strategy-health" class="health-list">
                    </div>
            </div>

            <div class="card history-card full-width">
                <h3>HISTÓRICO DE CICLOS (DNA)</h3>
                <div id="live-history" class="ball-grid">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="main.js"></script>
</body>
</html>
