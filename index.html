<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS IA — DNA PROFISSIONAL</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --panel: rgba(13, 17, 23, 0.9);
            --neon-blue: #00d2ff;
            --orange: #ff4e00;
            --green: #00ff95;
            --red: #ff3e5e;
        }

        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; overflow-x: hidden; }
        .dashboard { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 380px 1fr; gap: 25px; }

        /* HEADER */
        .header-main { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .logo h1 { font-family: 'Orbitron'; font-weight: 900; color: var(--orange); margin: 0; font-size: 1.8rem; }
        .logo p { font-size: 0.6rem; letter-spacing: 3px; opacity: 0.6; margin: 2px 0; }

        /* CARDS FUTURISTAS [cite: 2025-12-29] */
        .card { background: var(--panel); border: 1.5px solid #1f2530; border-radius: 12px; padding: 20px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-neon { border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 210, 255, 0.1); }
        
        /* PLACAR ASSERTIVIDADE [cite: 2025-12-29] */
        .label-blue { color: #4e8eff; font-size: 0.6rem; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; display: block; text-align: center; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid #222; padding-top: 15px; }
        .stat-item { text-align: center; }
        .stat-val { font-family: 'Orbitron'; font-size: 1.6rem; display: block; font-weight: 700; }
        .stat-lab { font-size: 0.5rem; color: #555; text-transform: uppercase; }

        /* STATUS DNA [cite: 2025-12-29] */
        .dna-box { display: flex; align-items: center; gap: 20px; margin: 15px 0; }
        .dna-num { font-family: 'Orbitron'; font-size: 4.5rem; font-weight: 900; line-height: 1; }
        .dna-text-group { display: flex; flex-direction: column; }
        .dna-status-label { font-size: 0.5rem; color: #666; font-weight: bold; }
        .dna-status-msg { font-family: 'Orbitron'; font-size: 0.9rem; font-weight: bold; text-transform: uppercase; }

        /* BOTÃO GLOW [cite: 2025-12-29] */
        .btn-gerar { background: linear-gradient(90deg, #ff4e00, #ec9f05); border: none; border-radius: 10px; color: white; padding: 22px; font-family: 'Orbitron'; font-weight: 900; font-size: 1.3rem; cursor: pointer; box-shadow: 0 0 30px rgba(255, 78, 0, 0.4); width: 100%; margin-top: 10px; transition: 0.3s; letter-spacing: 1px; }
        .btn-gerar:hover { transform: translateY(-3px); filter: brightness(1.2); }

        /* HISTÓRICO REAL [cite: 2025-12-29] */
        .main-content { background: var(--panel); border: 2px solid var(--neon-blue); border-radius: 20px; padding: 35px; position: relative; }
        .hist-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        .hist-title { font-family: 'Orbitron'; font-size: 0.75rem; letter-spacing: 2px; opacity: 0.5; font-style: italic; }
        
        .ball-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 15px; }
        .ball { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: 'Orbitron'; font-size: 0.85rem; position: relative; box-shadow: inset 0 -4px 8px rgba(0,0,0,0.6); }
        
        /* CORES DNA [cite: 2025-12-28, 2025-12-29] */
        .Verde { background: radial-gradient(circle at 30% 30%, #00ff95, #008f53); box-shadow: 0 0 15px var(--green); color: #000; }
        .Vermelho { background: radial-gradient(circle at 30% 30%, #ff3e5e, #a31d34); box-shadow: 0 0 15px var(--red); color: white; }
        .Preto { background: radial-gradient(circle at 30% 30%, #444, #000); border: 1px solid #555; color: white; }
    </style>
</head>
<body>

    <div class="dashboard">
        <header class="header-main">
            <div class="logo">
                <h1>NEXUS <span style="color:#fff">IA</span></h1>
                <p>SISTEMA DNA PROFISSIONAL</p>
            </div>
            <button onclick="location.reload()" style="background:none; border:1.5px solid var(--neon-blue); color:var(--neon-blue); padding:5px 15px; border-radius:5px; font-family:'Orbitron'; font-size:0.5rem; cursor:pointer;">SINCRONIZAR AGORA</button>
        </header>

        <div class="side-panel" style="display:flex; flex-direction:column; gap:25px;">
            <div class="card">
                <span class="label-blue">Assertividade Acumulada</span>
                <div class="stats-grid">
                    <div class="stat-item"><span id="g-count" class="stat-val" style="color:var(--green)">1</span><span class="stat-lab">Greens</span></div>
                    <div class="stat-item"><span id="l-count" class="stat-val" style="color:var(--red)">0</span><span class="stat-lab">Losses</span></div>
                    <div class="stat-item"><span class="stat-val" style="color:var(--orange)">100%</span><span class="stat-lab">Win Rate</span></div>
                </div>
            </div>

            <div class="card">
                <p style="font-size: 0.6rem; color: var(--green); margin: 0; font-weight: bold;">■ DNA: MONITORANDO CICLOS</p>
                <div class="dna-box">
                    <div id="num-display" class="dna-num">--</div>
                    <div class="dna-text-group">
                        <span class="dna-status-label">STATUS DO CICLO:</span>
                        <span id="dna-status" class="dna-status-msg">AGUARDANDO...</span>
                    </div>
                </div>
            </div>

            <button class="btn-gerar" onclick="gerarAnaliseIA()">GERAR ANÁLISE IA</button>
        </div>

        <div class="main-content">
            <div class="hist-top">
                <span class="hist-title">HISTÓRICO REAL (ÚLTIMOS 100 GIROS)</span>
                <span style="font-size: 0.5rem; opacity: 0.4;">Terminal Repete 3-6x [cite: 2025-12-29]</span>
            </div>
            <div id="historico-lista" class="ball-grid">
                </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://tpotbyekboefgbgmckp.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwb3RieWVrYm9lZmdjYmdtY2twIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MDc1NjgsImV4cCI6MjA4MjM4MzU2OH0.rlZzMH0EWY54gk9MNolp_KTC2DYFxkb3P7KtPw_aYWw";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        let ultimoId = null;
        let greens = 1;

        async function sincronizarDNA() {
            const { data } = await supabaseClient.from('resultados_nexus').select('*').order('id', { ascending: false }).limit(1);
            if (data && data[0] && data[0].id !== ultimoId) {
                ultimoId = data[0].id;
                const reg = data[0];
                
                document.getElementById('num-display').innerText = reg.numero;
                document.getElementById('num-display').style.color = (reg.cor === "Verde") ? "var(--green)" : (reg.cor === "Vermelho") ? "var(--red)" : "#fff";
                document.getElementById('dna-status').innerText = reg.resultado.toUpperCase();
                
                if(reg.resultado.includes("Green")) { 
                    greens++; 
                    document.getElementById('g-count').innerText = greens; 
                }
                
                carregarHistoricoReal();
            }
        }

        async function carregarHistoricoReal() {
            const { data } = await supabaseClient.from('resultados_nexus').select('numero, cor').order('id', { ascending: false }).limit(20);
            if (data) {
                document.getElementById('historico-lista').innerHTML = data.map(n => `
                    <div class="ball ${n.cor}">${n.numero}</div>
                `).join('');
            }
        }

        async function gerarAnaliseIA() {
            const { data } = await supabaseClient.from('resultados_nexus').select('*').order('id', { ascending: false }).limit(1);
            if (data && data[0]) {
                const reg = data[0];
                const status = document.getElementById('dna-status');
                
                // Lógica de Complemento [cite: 2025-12-29]
                if (reg.resultado.includes("picado")) {
                    const alvo = 6; 
                    const falta = alvo - reg.numero;
                    status.innerText = `AGUARDAR COMPLEMENTO (${falta})`;
                    status.style.color = "var(--orange)";
                } else {
                    status.innerText = "BUSCANDO ENTRADA...";
                    status.style.color = "#fff";
                }
            }
        }

        setInterval(sincronizarDNA, 5000);
        sincronizarDNA();
    </script>
</body>
</html>
