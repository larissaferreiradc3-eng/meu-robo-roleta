<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS IA — MEGA ROULETTE DNA</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .container { display: flex; width: 100%; }
        .painel { flex: 2; padding: 40px; display: flex; flex-direction: column; gap: 20px; }
        .lateral { flex: 1; border-left: 2px solid #00f2ff; padding: 20px; background: rgba(0,242,255,0.05); overflow-y: auto; }
        .status-box { border: 2px solid #00f2ff; border-radius: 15px; padding: 30px; text-align: center; }
        #monitor-status { font-size: 28px; font-weight: bold; color: #00f2ff; }
        .bola { width: 45px; height: 45px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin: 5px; font-weight: bold; }
        .Vermelho { background: #ff0000; } .Preto { background: #1a1a1a; border: 1px solid #444; } .Verde { background: #00ff00; color: #000; }
        .btn { background: linear-gradient(90deg, #ff6600, #ffcc00); border: none; padding: 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="painel">
            <h1 style="color:#ff6600">NEXUS IA</h1>
            <div class="status-box">
                <p style="text-align: left; color: #00f2ff; font-size: 12px; margin: 0 0 10px 0;">■ MONITOR DE CICLOS DNA - MEGA</p>
                <div id="monitor-status">CONECTANDO...</div>
            </div>
            <button class="btn">GERAR ANÁLISE IA</button>
        </div>
        <div class="lateral" id="lista-bolinhas"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // LIMPEZA AUTOMÁTICA DA URL PARA EVITAR O ERRO DO PRINT
        const rawUrl = "https://tpotbyekboefgbgmckp.supabase.co";
        const cleanUrl = rawUrl.trim(); 
        const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwb3RieWVrYm9lZmdjYmdtY2twIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NjgwNzU2OCwiZXhwIjoyMDgyMzgzNTY4fQ.F7J0g_iTIE_7oxXsGpObSsRq7AApc1y7pvpLmYjQcgk";
        
        const supabaseClient = supabase.createClient(cleanUrl, KEY);

        function adicionarBola(num, cor) {
            const div = document.createElement('div');
            div.className = `bola ${cor}`;
            div.innerText = num;
            document.getElementById('lista-bolinhas').prepend(div);
        }

        // ESCUTA O SINAL DO PYTHON EM TEMPO REAL [cite: 2025-12-29]
        supabaseClient.channel('public:resultados_nexus').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'resultados_nexus' }, (payload) => {
            const monitor = document.getElementById('monitor-status');
            monitor.innerText = payload.new.resultado;
            monitor.style.color = payload.new.resultado.includes("picado") ? "#FF8C00" : "#00f2ff";
            adicionarBola(payload.new.numero, payload.new.cor);
        }).subscribe();
    </script>
</body>
</html>
