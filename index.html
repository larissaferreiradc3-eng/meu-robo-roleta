<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS IA — DNA PROFISSIONAL</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #050505;
            --card-bg: #0d1117;
            --orange: #ff4e00;
            --orange-glow: rgba(255, 78, 0, 0.4);
            --green: #00ff95;
            --red: #ff3e5e;
        }

        body { background: var(--bg-body); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .dashboard { width: 100%; max-width: 1000px; display: grid; grid-template-columns: 350px 1fr; gap: 20px; }

        /* PAINÉIS LATERAIS [cite: 2025-12-29] */
        .side-panel { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid #1f2530; border-radius: 15px; padding: 20px; position: relative; }
        
        .header-title { color: var(--orange); font-family: 'Orbitron'; font-weight: 900; font-size: 1.5rem; margin: 0; }
        .subtitle { font-size: 0.6rem; letter-spacing: 2px; opacity: 0.6; margin-bottom: 20px; }

        /* ASSERTIVIDADE [cite: 2025-12-29] */
        .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; border-top: 1px solid #222; padding-top: 15px; }
        .stat-val { font-family: 'Orbitron'; font-size: 1.5rem; display: block; }
        .stat-lab { font-size: 0.5rem; color: #666; text-transform: uppercase; }

        /* STATUS DNA [cite: 2025-12-29] */
        .dna-val { font-family: 'Orbitron'; font-size: 4rem; font-weight: 900; margin: 10px 0; }
        .dna-status { font-size: 0.8rem; font-weight: bold; color: #fff; text-transform: uppercase; }

        /* BOTÃO LARANJA [cite: 2025-12-29] */
        .btn-gerar { background: linear-gradient(90deg, #ff4e00, #ec9f05); border: none; border-radius: 12px; color: white; padding: 20px; font-family: 'Orbitron'; font-weight: 900; font-size: 1.2rem; cursor: pointer; box-shadow: 0 0 20px var(--orange-glow); width: 100%; transition: 0.3s; }
        .btn-gerar:hover { transform: scale(1.02); filter: brightness(1.2); }

        /* PAINEL HISTÓRICO [cite: 2025-12-29] */
        .main-panel { background: var(--card-bg); border: 1px solid #1f2530; border-radius: 15px; padding: 30px; }
        .hist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .hist-title { font-family: 'Orbitron'; font-size: 0.7rem; letter-spacing: 2px; opacity: 0.5; }

        .ball-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 15px; }
        .ball { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: 'Orbitron'; font-size: 0.9rem; position: relative; box-shadow: inset 0 -5px 10px rgba(0,0,0,0.5); }
        
        /* CORES DNA [cite: 2025-12-28, 2025-12-29] */
        .Verde { background: radial-gradient(circle at 30% 30%, #00ff95, #008f53); box-shadow: 0 0 15px var(--green); color: #000; }
        .Vermelho { background: radial-gradient(circle at 30% 30%, #ff3e5e, #a31d34); box-shadow: 0 0 15px var(--red); }
        .Preto { background: radial-gradient(circle at 30% 30%, #333, #000); border: 1px solid #444; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="side-panel">
            <div class="card">
                <h1 class="header-title">NEXUS IA</h1>
                <p class="subtitle">SISTEMA DNA PROFISSIONAL</p>
                
                <p style="font-size: 0.6rem; color: #4e8eff; font-weight: bold; margin-bottom: 10px;">ASSERTIVIDADE ACUMULADA</p>
                <div class="stats-row">
                    <div><span id="g-count" class="stat-val" style="color:var(--green)">1</span><span class="stat-lab">Greens</span></div>
                    <div><span id="l-count" class="stat-val" style="color:var(--red)">0</span><span class="stat-lab">Losses</span></div>
                    <div><span class="stat-val" style="color:var(--orange)">100%</span><span class="stat-lab">Win Rate</span></div>
                </div>
            </div>

            <div class="card">
                <p class="subtitle" style="margin:0; color:var(--green)">✅ DNA: MONITORANDO CICLOS</p>
                <div id="num-display" class="dna-val">--</div>
                <p class="stat-lab">STATUS DO CICLO:</p>
                <p id="dna-status" class="dna-status">AGUARDANDO...</p>
            </div>

            <button class="btn-gerar" onclick="gerarAnaliseIA()">GERAR ANÁLISE IA</button>
        </div>

        <div class="main-panel">
            <div class="hist-header">
                <span class="hist-title">HISTÓRICO REAL (ÚLTIMOS 100 GIROS)</span>
                <span style="font-size: 0.5rem; opacity: 0.4;">Terminal Repete 3-6x [cite: 2025-12-29]</span>
            </div>
            <div id="historico-lista" class="ball-grid">
                </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://tpotbyekboefgbgmckp.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwb3RieWVrYm9lZmdjYmdtY2twIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MDc1NjgsImV4cCI6MjA4MjM4MzU2OH0.rlZzMH0EWY54gk9MNolp_KTC2DYFxkb3P7KtPw_aYWw";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        let ultimoId = null;
        let greens = 1;

        async function sincronizar() {
            const { data } = await supabaseClient.from('resultados_nexus').select('*').order('id', { ascending: false }).limit(1);
            if (data && data[0] && data[0].id !== ultimoId) {
                ultimoId = data[0].id;
                const reg = data[0];
                
                document.getElementById('num-display').innerText = reg.numero;
                document.getElementById('dna-status').innerText = reg.resultado.toUpperCase();
                
                if(reg.resultado.includes("Green")) { 
                    greens++; 
                    document.getElementById('g-count').innerText = greens; 
                }
                
                carregarH();
            }
        }

        async function carregarH() {
            const { data } = await supabaseClient.from('resultados_nexus').select('numero, cor').order('id', { ascending: false }).limit(20);
            if (data) {
                document.getElementById('historico-lista').innerHTML = data.map(n => `
                    <div class="ball ${n.cor}">${n.numero}</div>
                `).join('');
            }
        }

        async function gerarAnaliseIA() {
            const { data } = await supabaseClient.from('resultados_nexus').select('*').order('id', { ascending: false }).limit(1);
            if (data && data[0]) {
                const reg = data[0];
                if (reg.resultado.includes("picado")) {
                    const alvo = 6; 
                    const falta = alvo - reg.numero;
                    document.getElementById('dna-status').innerText = `AGUARDAR COMPLEMENTO (${falta})`;
                    document.getElementById('dna-status').style.color = "var(--orange)";
                }
            }
        }

        setInterval(sincronizar, 5000);
        sincronizar();
    </script>
</body>
</html>
